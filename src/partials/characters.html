<section class="characters-section" id="characters">
  <div class="container characters-container">
    <h2 class="characters-title">Characters</h2>

    <ul class="characters-list">
      <li class="characters-card">
        <div class="characters-img-thumb">
          <img
            class="characters-img"
            src="./img/characters/comic.png"
            alt="Comic Character"
          />
        </div>
        <div class="characters-card-wrapper">
          <h3 class="characters-card-title">Comic</h3>
          <p class="characters-card-text">
            A cheerful helper known for combo-boosting tricks.
          </p>
        </div>
      </li>
      <li class="characters-card">
        <div class="characters-img-thumb">
          <img
            class="characters-img"
            src="./img/characters/loafer.png"
            alt="Loafer Character"
          />
        </div>
        <div class="characters-card-wrapper">
          <h3 class="characters-card-title">Loafer</h3>
          <p class="characters-card-text">
            A laid-back companion offering steady, reliable boosts.
          </p>
        </div>
      </li>
      <li class="characters-card">
        <div class="characters-img-thumb">
          <img
            class="characters-img"
            src="./img/characters/clumsy.png"

          />
        </div>
        <div class="characters-card-wrapper">
          <h3 class="characters-card-title">Clumsy</h3>
          <p class="characters-card-text">

          </p>
        </div>
      </li>
      <li class="characters-card">
        <div class="characters-img-thumb">
          <img
            class="characters-img"
            src="./img/characters/prankster.png"
            alt="Prankster Character"
          />
        </div>
        <div class="characters-card-wrapper">
          <h3 class="characters-card-title">Prankster</h3>
          <p class="characters-card-text">
            Adds playful twists that shake up tricky boards.
          </p>
        </div>
