<section class="hero" id="hero">
  <div class="hero-cont container">
    <div class="hero-visual">
      <img
        class="hero-form-image"
        src="./img/form-2.png"
        alt=""
        aria-hidden="true"
      />

      <img
        class="hero-image"
        src="./img/hero.png"
        alt="Jolly Match 3 characters"
        loading="lazy"
      />
    </div>

    <div class="hero-content">
      <img
        class="hero-match"
        src="./img/title.png"
        alt="Match Sweetly. Rebuild Joyfully"
        loading="lazy"
      />

      <h1 class="visually-hidden">Match Sweetly. Rebuild Joyfully</h1>

      <p class="hero-text">
        Restore a candy-coated world with puzzles, friends, and lovable helpers.
      </p>

      <a
        class="hero-button"
        href="https://play.google.com/store/apps/details?id=com.jollyco.jollybattlematch3&hl=en&gl=us"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          class="store-icon"
          width="28"
          height="28"
          aria-hidden="true"
          focusable="false"
        >
          <use href="./img/sprite.svg#icon-google-play"></use>
        </svg>

        <span class="hero-button-text">
          <span class="hero-button-small">PLAY ON</span>
          <span class="hero-button-main">Google Play</span>
        </span>
      </a>
    </div>
  </div>
</section>
